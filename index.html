<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro | Celulares 653</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-md">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-lg">
          <i class="fa-solid fa-list-check text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            TaskFlow Pro <span class="text-xs bg-brand-500/20 text-brand-400 px-2 py-0.5 rounded border border-brand-500/30">Celulares 653</span>
          </h1>
          <p class="text-xs text-slate-400">Control operativo y alertas de taller</p>
        </div>
      </div>

      <!-- Perfil y Control de Turno -->
      <div class="flex items-center gap-3">
        <select id="userSelector" onchange="cambiarUsuario()" class="bg-slate-700 text-slate-200 text-xs font-medium rounded-lg px-2.5 py-1.5 border border-slate-600 outline-none">
          <option value="Arturo (Admin)">Arturo (Admin)</option>
          <option value="Gilberto (Taller)" selected>Gilberto (Taller)</option>
        </select>

        <button id="shiftBtn" onclick="toggleTurno()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition border shadow-sm bg-emerald-950 text-emerald-400 border-emerald-600/40">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="shiftText">Turno Activo</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido -->
  <main class="max-w-5xl mx-auto w-full p-4 flex-1 flex flex-col gap-5">

    <!-- Navegación de Pestañas -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
      <div class="flex gap-2">
        <button onclick="setTab('tasks')" id="tabTasks" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-brand-600 text-white flex items-center gap-2">
          <i class="fa-solid fa-clock"></i> Tareas de Hoy
        </button>
        <button onclick="setTab('reports')" id="tabReports" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center gap-2">
          <i class="fa-solid fa-chart-pie"></i> Reporte e Incumplimientos
        </button>
      </div>
      <button onclick="openModal()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-plus"></i> Nueva Tarea
      </button>
    </div>

    <!-- Banner Alerta Activa -->
    <div id="alertBanner" class="hidden bg-rose-500/20 border border-rose-500 text-rose-300 p-3 rounded-xl flex items-center justify-between animate-bounce">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-triangle-exclamation text-xl text-rose-400"></i>
        <div>
          <p class="font-bold text-sm">¡Tarea vencida sin completar!</p>
          <p class="text-xs text-rose-200">Revisa la lista de tareas para registrar su cumplimiento.</p>
        </div>
      </div>
      <button onclick="silenciarAlarma()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1 rounded-lg text-xs font-bold">
        Silenciar (15m)
      </button>
    </div>

    <!-- Vista de Tareas -->
    <section id="viewTasks" class="grid grid-cols-1 md:grid-cols-2 gap-4"></section>

    <!-- Vista de Reportes -->
    <section id="viewReports" class="hidden flex flex-col gap-4">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
          <span class="text-xs text-slate-400">Total Programadas</span>
          <p id="repTotal" class="text-2xl font-bold text-white mt-1">0</p>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
          <span class="text-xs text-slate-400">Completadas a Tiempo</span>
          <p id="repDone" class="text-2xl font-bold text-emerald-400 mt-1">0</p>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
          <span class="text-xs text-slate-400">Incumplidas / Con Retraso</span>
          <p id="repOverdue" class="text-2xl font-bold text-rose-400 mt-1">0</p>
        </div>
      </div>
      <div class="flex justify-end">
        <button onclick="exportCSV()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 rounded-lg text-xs font-semibold flex items-center gap-2">
          <i class="fa-solid fa-file-csv text-emerald-400"></i> Exportar Resumen a CSV
        </button>
      </div>
    </section>
  </main>

  <!-- Modal Crear Tarea -->
  <div id="taskModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl flex flex-col gap-4">
      <h3 class="text-base font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-calendar-plus text-brand-400"></i> Asignar Tarea
      </h3>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Título de la Tarea</label>
          <input type="text" id="taskTitle" placeholder="Ej. Limpieza ultrasónica o inventario" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none focus:border-brand-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">Asignar a</label>
            <select id="taskAssignee" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none">
              <option value="Gilberto (Taller)">Gilberto (Taller)</option>
              <option value="Arturo (Admin)">Arturo (Admin)</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Frecuencia</label>
            <select id="taskType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none">
              <option value="Diaria">Diaria</option>
              <option value="Única">Única</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Hora límite</label>
          <input type="time" id="taskTime" value="18:00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-semibold text-slate-300">Cancelar</button>
        <button onclick="saveTask()" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-semibold text-white">Guardar Tarea</button>
      </div>
    </div>
  </div>

  <script>
    // Audio Sintetizado (Sin archivos externos)
    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {
        console.error("Audio error", e);
      }
    }

    // Estado Inicial
    let turnActive = localStorage.getItem('shift') !== 'false';
    let silenceUntil = 0;
    let tasks = JSON.parse(localStorage.getItem('tasks_653')) || [
      { id: 1, title: 'Limpieza de estación y microscopios', assignedTo: 'Gilberto (Taller)', type: 'Diaria', time: '11:00', status: 'pending' },
      { id: 2, title: 'Inventario de pantallas y flex MEP', assignedTo: 'Gilberto (Taller)', type: 'Diaria', time: '14:30', status: 'pending' },
      { id: 3, title: 'Cierre de pedidos paquetería', assignedTo: 'Arturo (Admin)', type: 'Diaria', time: '18:00', status: 'pending' }
    ];

    function updateStorage() {
      localStorage.setItem('tasks_653', JSON.stringify(tasks));
      localStorage.setItem('shift', turnActive);
      render();
    }

    function toggleTurno() {
      turnActive = !turnActive;
      const btn = document.getElementById('shiftBtn');
      const text = document.getElementById('shiftText');
      if (turnActive) {
        btn.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition border shadow-sm bg-emerald-950 text-emerald-400 border-emerald-600/40';
        text.innerText = 'Turno Activo';
      } else {
        btn.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition border shadow-sm bg-slate-800 text-slate-400 border-slate-700';
        text.innerText = 'Fuera de Turno';
      }
      updateStorage();
    }

    function setTab(tab) {
      if (tab === 'tasks') {
        document.getElementById('viewTasks').classList.remove('hidden');
        document.getElementById('viewReports').classList.add('hidden');
        document.getElementById('tabTasks').className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-brand-600 text-white flex items-center gap-2';
        document.getElementById('tabReports').className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center gap-2';
      } else {
        document.getElementById('viewTasks').classList.add('hidden');
        document.getElementById('viewReports').classList.remove('hidden');
        document.getElementById('tabReports').className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-brand-600 text-white flex items-center gap-2';
        document.getElementById('tabTasks').className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center gap-2';
      }
    }

    function completeTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, status: 'completed' } : t);
      updateStorage();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      updateStorage();
    }

    function openModal() { document.getElementById('taskModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('taskModal').classList.add('hidden'); }

    function saveTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const assignedTo = document.getElementById('taskAssignee').value;
      const type = document.getElementById('taskType').value;
      const time = document.getElementById('taskTime').value;

      if (!title) return alert('Por favor escribe un título.');

      tasks.push({ id: Date.now(), title, assignedTo, type, time, status: 'pending' });
      document.getElementById('taskTitle').value = '';
      closeModal();
      updateStorage();
    }

    function silenciarAlarma() {
      silenceUntil = Date.now() + 15 * 60 * 1000;
      document.getElementById('alertBanner').classList.add('hidden');
    }

    function render() {
      const container = document.getElementById('viewTasks');
      container.innerHTML = '';

      const now = new Date();
      const currentH = now.getHours();
      const currentM = now.getMinutes();
      const nowTotalMin = currentH * 60 + currentM;

      let hayVencidas = false;
      let total = tasks.length;
      let completadas = 0;
      let incumplidas = 0;

      tasks.forEach(t => {
        const [h, m] = t.time.split(':').map(Number);
        const taskMin = h * 60 + m;
        const isOverdue = t.status === 'pending' && nowTotalMin > taskMin;

        if (t.status === 'completed') completadas++;
        if (isOverdue) {
          incumplidas++;
          hayVencidas = true;
        }

        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border transition flex flex-col justify-between ${
          t.status === 'completed' 
            ? 'bg-slate-800/40 border-slate-700/40 opacity-70' 
            : isOverdue 
              ? 'bg-rose-950/20 border-rose-600/50' 
              : 'bg-slate-800 border-slate-700 shadow-md'
        }`;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded ${
                t.status === 'completed' ? 'bg-emerald-500/20 text-emerald-400' : isOverdue ? 'bg-rose-500/20 text-rose-400' : 'bg-slate-700 text-slate-300'
              }">${t.status === 'completed' ? 'Completada' : isOverdue ? '¡Vencida!' : 'Pendiente'}</span>
              <span class="text-xs text-slate-400 font-mono"><i class="fa-regular fa-clock mr-1"></i>${t.time}</span>
            </div>
            <h4 class="text-sm font-bold text-white mb-1 ${t.status === 'completed' ? 'line-through text-slate-400' : ''}">${t.title}</h4>
            <p class="text-xs text-slate-400"><i class="fa-regular fa-user mr-1 text-slate-500"></i>${t.assignedTo}</p>
          </div>

          <div class="flex items-center justify-between mt-4 pt-3 border-t border-slate-700/50">
            <span class="text-[11px] text-slate-400">${t.type}</span>
            <div class="flex gap-2">
              <button onclick="deleteTask(${t.id})" class="text-slate-500 hover:text-rose-400 text-xs px-2 py-1"><i class="fa-solid fa-trash"></i></button>
              ${t.status !== 'completed' ? `<button onclick="completeTask(${t.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5"><i class="fa-solid fa-check"></i> Listo</button>` : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      // Reporte
      document.getElementById('repTotal').innerText = total;
      document.getElementById('repDone').innerText = completadas;
      document.getElementById('repOverdue').innerText = incumplidas;

      // Alertas
      const banner = document.getElementById('alertBanner');
      if (hayVencidas && turnActive && Date.now() > silenceUntil) {
        banner.classList.remove('hidden');
        playBeep();
      } else {
        banner.classList.add('hidden');
      }
    }

    function exportCSV() {
      let csv = 'ID,Titulo,Responsable,Frecuencia,Hora,Estado\n';
      tasks.forEach(t => {
        csv += `"${t.id}","${t.title}","${t.assignedTo}","${t.type}","${t.time}","${t.status}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reporte_tareas_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    render();
    setInterval(render, 30000); // Evalúa tiempos cada 30 segundos
  </script>
</body>
</html>
